<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1A2430"/>
      <stop offset="100%" stop-color="#0F1113"/>
    </radialGradient>
    <linearGradient id="trail1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="trail2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CC5FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7CC5FF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <circle cx="128" cy="128" r="88" fill="none" stroke="#3A434C" stroke-width="3.4"/>
  <circle cx="128" cy="128" r="54" fill="none" stroke="#3A434C" stroke-width="2.6" opacity="0.7"/>
  <circle cx="128" cy="128" r="21" fill="none" stroke="#3A434C" stroke-width="2" opacity="0.45"/>

  <path d="M 128 40 A 88 88 0 0 0 40 128" fill="none" stroke="url(#trail1)"
        stroke-width="3.4" stroke-linecap="round" transform="rotate(150 128 128)"/>
  <path d="M 128 74 A 54 54 0 0 1 182 128" fill="none" stroke="url(#trail2)"
        stroke-width="2.6" stroke-linecap="round" transform="rotate(-40 128 128)"/>

  <g filter="url(#glow)">
    <circle cx="128" cy="40" r="13" fill="#4DA3FF" transform="rotate(150 128 128)"/>
  </g>
  <circle cx="128" cy="74" r="8" fill="#7CC5FF" transform="rotate(-40 128 128)" opacity="0.9"/>
  <circle cx="128" cy="107" r="5" fill="#7CC5FF" transform="rotate(70 128 128)" opacity="0.6"/>
</svg>